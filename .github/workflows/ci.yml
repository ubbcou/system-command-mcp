name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node -e "if (process.platform === 'win32' && process.arch !== 'x64') throw new Error('windows must be x64')"
      # macos-latest is currently x64; public macOS arm64 runners are not universally available.
      - run: node -e "if (process.platform === 'darwin') console.log('macOS architecture:', process.arch)"
      - run: npm ci
      - run: npm test
