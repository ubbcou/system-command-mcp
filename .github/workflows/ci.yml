name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node -e "if (process.platform === 'win32' && process.arch !== 'x64') throw new Error('windows must be x64')"
      # macos-latest is currently x64; public macOS arm64 runners are not universally available.
      - run: node -e "if (process.platform === 'darwin') console.log('macOS architecture:', process.arch)"
      - run: npm ci
      - run: npm test
      - name: Run DSH-independent runtime portable acceptance
        run: npm run acceptance:runtime-portable
      # DSH 0.1.0-rc.6 uses Promise.withResolvers; this host test is Node 22-only.
      # This does not narrow system-command-mcp's Node >=20 support or core test matrix.
      - name: Install pinned DSH acceptance runtime
        if: matrix.node == 22
        run: npm ci --prefix acceptance/dsh
      - name: Run portable DSH acceptance
        if: matrix.node == 22
        run: npm run acceptance:portable
      - name: Run DSH direct and reconnect acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          npm run acceptance:dsh
          npm run acceptance:dsh-reconnect
